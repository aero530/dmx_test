[package]
name = "dmx_test"
version = "0.1.0"
edition = "2024"
resolver = "3"

[[bin]]
name = "dmx_test"
test = false
bench = false



[dependencies]
# Change stm32f303ze to your chip name, if necessary.
ansi_rgb = {git="https://github.com/rust-osdev/ansi_rgb.git"}

bit_field = "0.10.2"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embedded-hal-async = "1.0.0"

embassy-stm32 = { version = "0.2.0", features = [ "defmt", "stm32f746zg", "unstable-pac", "memory-x", "time-driver-tim2", "exti"]  }
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "task-arena-size-65536"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
# 0.4.0
# embassy-usb = { version = "0.5.0", features = ["defmt"] }
embassy-futures = { version = "0.1.0" }
# 0.6.2
embassy-sync = { version = "0.7.0", features = ["defmt"] } 
embassy-embedded-hal = "0.3.0"
embassy-net = {version="0.7.0", features = ["defmt", "udp", "dhcpv4", "medium-ethernet", "dns"]}


panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2"
rgb = "0.8.50"
smart-leds = "0.4.0"
smart-leds-trait = "0.3.1"
# oled_async = "0.2.0"
# embedded-graphics = "0.8.1"
display-interface = {version="0.5.0", features = ["defmt-03"]}
display-interface-i2c = "0.5.0"

rand_core = "0.9.3"
embedded-io-async = "0.6.1"
# tiny-artnet = "0.1.3"
# mousefood = {git="https://github.com/j-g00da/mousefood.git"}
# ratatui-core = {version="0.1.0-alpha.6"}
# ratatui-widgets = {version="0.3.0-alpha.5"}
format_no_std = "1.2.0"

embedded-alloc = "0.6.0"

pwm-pca9685 = { version = "1.0.0", features = ["async"] }

[profile.release]
debug = 2




[patch.crates-io]
