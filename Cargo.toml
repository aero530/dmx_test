[workspace]
resolver = "3"
# members = [ "nucleo","rp2040"]
members = [ "nucleo","rp2040","rp2040_dmx"]
# dmx_console (PC tool) and host_tests (host-runnable firmware unit tests)
# have their own dependency trees; keeping them out of the embedded
# workspace keeps Cargo.lock clean.
exclude = ["dmx_console", "host_tests"]

# Build profiles must be defined here: cargo silently ignores [profile.*]
# sections in workspace member manifests (nucleo, rp2040_dmx, ...).

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
