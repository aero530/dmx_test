<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="872" viewBox="0 0 1280 872" font-family="ui-sans-serif, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33383f"/>
    </marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6fd6"/>
    </marker>
    <style>
      .t    { fill:#1f2328; }
      .mut  { fill:#5b6570; }
      .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .box  { fill:#f6f7f9; stroke:#33383f; stroke-width:1.6; }
      .new  { fill:#e8f1fc; stroke:#1d6fd6; stroke-width:1.8; }
      .keep { fill:#f3f4f6; stroke:#6b7280; stroke-width:1.5; }
      .pwr  { fill:#fef3c7; stroke:#b45309; stroke-width:1.6; }
      .p33  { fill:#d1fae5; stroke:#059669; stroke-width:1.6; }
      .iso  { fill:#ede9fe; stroke:#7c3aed; stroke-width:1.6; }
      .ext  { fill:#ffffff; stroke:#33383f; stroke-width:1.8; }
      .w    { stroke:#33383f; stroke-width:1.6; fill:none; }
      .wp   { stroke:#b45309; stroke-width:2.2; fill:none; }
      .wb   { stroke:#1d6fd6; stroke-width:1.8; fill:none; }
    </style>
  </defs>

  <rect width="1280" height="872" fill="#ffffff"/>

  <text x="36" y="40" font-size="23" font-weight="700" class="t">DMX Interface Rev 2 — System Block Diagram</text>
  <text x="36" y="63" font-size="13.5" class="mut">Single-module carrier: W6300-EVB-Pico2 (RP2350 + W6300) drives Ethernet, wired DMX, USB, UI and 8× WS2812 from PIO</text>

  <!-- legend -->
  <g transform="translate(905,26)">
    <rect x="0" y="0" width="345" height="74" rx="6" fill="#fbfbfa" stroke="#d4d8dd"/>
    <rect x="12" y="13" width="15" height="11" rx="2" class="new"/>
    <text x="34" y="23" font-size="11.5" class="t">New / changed in Rev 2</text>
    <rect x="182" y="13" width="15" height="11" rx="2" class="keep"/>
    <text x="204" y="23" font-size="11.5" class="t">Carried over from Rev 1</text>
    <rect x="12" y="34" width="15" height="11" rx="2" class="pwr"/>
    <text x="34" y="44" font-size="11.5" class="t">5 V power</text>
    <rect x="182" y="34" width="15" height="11" rx="2" class="p33"/>
    <text x="204" y="44" font-size="11.5" class="t">3V3 power</text>
    <rect x="12" y="55" width="15" height="11" rx="2" class="iso"/>
    <text x="34" y="65" font-size="11.5" class="t">Isolated domain</text>
    <text x="204" y="65" font-size="11.5" class="mut">dashed = isolation barrier</text>
  </g>

  <!-- ================= EXTERNAL I/O (left) ================= -->
  <text x="36" y="105" font-size="12" font-weight="700" class="mut">EXTERNAL</text>

  <rect x="36" y="118" width="150" height="46" rx="5" class="ext"/>
  <text x="111" y="139" font-size="13" font-weight="600" text-anchor="middle" class="t">DMX IN</text>
  <text x="111" y="155" font-size="11" text-anchor="middle" class="mut">XLR-5 male (J5)</text>

  <rect x="36" y="174" width="150" height="46" rx="5" class="ext"/>
  <text x="111" y="195" font-size="13" font-weight="600" text-anchor="middle" class="t">DMX THRU</text>
  <text x="111" y="211" font-size="11" text-anchor="middle" class="mut">XLR-5 female (J15)</text>

  <rect x="36" y="286" width="150" height="46" rx="5" class="ext"/>
  <text x="111" y="307" font-size="13" font-weight="600" text-anchor="middle" class="t">Ethernet</text>
  <text x="111" y="323" font-size="11" text-anchor="middle" class="mut">RJ45 on module</text>

  <rect x="36" y="366" width="150" height="46" rx="5" class="ext"/>
  <text x="111" y="387" font-size="13" font-weight="600" text-anchor="middle" class="t">USB</text>
  <text x="111" y="403" font-size="11" text-anchor="middle" class="mut">micro-B on module</text>

  <rect x="36" y="470" width="150" height="52" rx="5" class="pwr"/>
  <text x="111" y="491" font-size="13" font-weight="600" text-anchor="middle" class="t">DC INPUT</text>
  <text x="111" y="507" font-size="11" text-anchor="middle" class="mut">5 V brick</text>

  <!-- ================= ISOLATED DMX FRONT END ================= -->
  <rect x="224" y="112" width="196" height="176" rx="7" class="iso"/>
  <text x="322" y="133" font-size="13" font-weight="700" text-anchor="middle" class="t">Isolated DMX front end</text>
  <text x="322" y="150" font-size="11" text-anchor="middle" class="mut">carried over from Rev 1</text>

  <rect x="240" y="160" width="164" height="30" rx="4" class="keep"/>
  <text x="322" y="180" font-size="11.5" text-anchor="middle" class="mono t">THVD1400 RS-485</text>

  <rect x="240" y="196" width="164" height="30" rx="4" class="keep"/>
  <text x="322" y="209" font-size="11" text-anchor="middle" class="t">3× opto TLP2368</text>
  <text x="322" y="221" font-size="10" text-anchor="middle" class="mut">U3 TX · U7 DE//RE · U8 RX</text>

  <rect x="240" y="232" width="164" height="30" rx="4" class="keep"/>
  <text x="322" y="245" font-size="11" text-anchor="middle" class="t">PS1 1S7BE 1 W iso</text>
  <text x="322" y="257" font-size="10" text-anchor="middle" class="mut">→ 3V3ISO / GNDISO</text>

  <text x="322" y="279" font-size="10" text-anchor="middle" class="mut">120 Ω term (JP28) · 680/120/680 bias</text>

  <!-- isolation barrier -->
  <line x1="432" y1="104" x2="432" y2="300" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="438" y="118" font-size="10" fill="#7c3aed" font-weight="600">isolation</text>
  <text x="438" y="130" font-size="10" fill="#7c3aed" font-weight="600">barrier</text>

  <!-- ================= PICO 2 MODULE ================= -->
  <rect x="490" y="112" width="330" height="430" rx="9" class="new"/>
  <text x="655" y="136" font-size="15" font-weight="700" text-anchor="middle" class="t">W6300-EVB-Pico2</text>
  <text x="655" y="153" font-size="11" text-anchor="middle" class="mut">socketed on 2×20 headers · A4 stepping</text>

  <rect x="510" y="168" width="290" height="86" rx="6" fill="#ffffff" stroke="#1d6fd6" stroke-width="1.5"/>
  <text x="655" y="188" font-size="13" font-weight="600" text-anchor="middle" class="t">W6300 hardwired TCP/IP</text>
  <text x="655" y="205" font-size="11" text-anchor="middle" class="mut">integrated PHY + magjack · 8 sockets · 64 KB</text>
  <text x="655" y="224" font-size="10.5" text-anchor="middle" class="mono t">GP15 INT · GP16 CS · GP17 SCLK · GP18–21 IO0–3</text>
  <text x="655" y="240" font-size="10.5" text-anchor="middle" class="mono t">GP22 RST — PIO SPI (hw SPI0 cannot reach GP17)</text>

  <rect x="510" y="268" width="290" height="150" rx="6" fill="#ffffff" stroke="#1d6fd6" stroke-width="1.5"/>
  <text x="655" y="288" font-size="13" font-weight="600" text-anchor="middle" class="t">RP2350 — 2× Cortex-M33 @ 150 MHz</text>
  <text x="655" y="304" font-size="11" text-anchor="middle" class="mut">520 KB SRAM · 3 PIO blocks / 12 SM</text>

  <rect x="524" y="316" width="128" height="44" rx="4" fill="#eef5fd" stroke="#1d6fd6" stroke-width="1.2"/>
  <text x="588" y="333" font-size="11.5" font-weight="600" text-anchor="middle" class="t">Core 0</text>
  <text x="588" y="348" font-size="10" text-anchor="middle" class="mut">net · Art-Net/sACN · router</text>

  <rect x="660" y="316" width="128" height="44" rx="4" fill="#eef5fd" stroke="#1d6fd6" stroke-width="1.2"/>
  <text x="724" y="333" font-size="11.5" font-weight="600" text-anchor="middle" class="t">Core 1</text>
  <text x="724" y="348" font-size="10" text-anchor="middle" class="mut">UI · DMX · LED render</text>

  <rect x="524" y="370" width="264" height="36" rx="4" fill="#eef5fd" stroke="#1d6fd6" stroke-width="1.2"/>
  <text x="656" y="384" font-size="10.5" text-anchor="middle" class="mono t">PIO0 spi+ws2812×3 · PIO1 ws2812×4</text>
  <text x="656" y="398" font-size="10.5" text-anchor="middle" class="mono t">PIO2 dmx in/out + ws2812×1  (1 SM spare)</text>

  <rect x="510" y="432" width="290" height="46" rx="6" class="p33"/>
  <text x="655" y="450" font-size="12" font-weight="600" text-anchor="middle" class="t">RT6150 buck-boost → 3V3(OUT)</text>
  <text x="655" y="466" font-size="10.5" text-anchor="middle" class="mut">module only (RP2350 + W6300) — output, never back-driven</text>

  <text x="655" y="500" font-size="11" text-anchor="middle" class="mut">VSYS (39) ← 5 V through Schottky   ·   VBUS (40) n/c   ·   3V3_EN (37) n/c</text>
  <text x="655" y="522" font-size="11" text-anchor="middle" class="mut">SWD debug header broken out on carrier</text>

  <!-- ================= OUTPUT STAGE ================= -->
  <rect x="872" y="150" width="168" height="150" rx="7" class="new"/>
  <text x="956" y="172" font-size="13" font-weight="700" text-anchor="middle" class="t">Level shift</text>
  <rect x="886" y="184" width="140" height="42" rx="4" class="keep"/>
  <text x="956" y="200" font-size="11.5" text-anchor="middle" class="mono t">SN74ACT245</text>
  <text x="956" y="215" font-size="10" text-anchor="middle" class="mut">3V3 → 5 V, 8 ch</text>
  <text x="956" y="244" font-size="10.5" text-anchor="middle" class="mut">DIR strapped (JP21 deleted)</text>
  <text x="956" y="260" font-size="10.5" text-anchor="middle" class="mut">330 Ω series per line</text>
  <text x="956" y="280" font-size="10.5" text-anchor="middle" class="mut">polyfuse per output</text>

  <g>
    <rect x="1080" y="150" width="164" height="150" rx="7" class="box"/>
    <text x="1162" y="172" font-size="13" font-weight="700" text-anchor="middle" class="t">WS2812 outputs</text>
    <text x="1162" y="196" font-size="12" text-anchor="middle" class="mono t">String 1 … String 8</text>
    <text x="1162" y="220" font-size="11" text-anchor="middle" class="mut">up to 600 LEDs each</text>
    <text x="1162" y="238" font-size="11" text-anchor="middle" class="mut">18 ms frame → 55 Hz max</text>
    <text x="1162" y="262" font-size="11" text-anchor="middle" class="mut">data + 5 V + GND</text>
    <text x="1162" y="282" font-size="10.5" class="mut" text-anchor="middle">4800 LEDs ≈ 29 universes (RGB)</text>
  </g>

  <!-- ================= UI / I2C ================= -->
  <rect x="872" y="352" width="372" height="190" rx="7" class="box"/>
  <text x="1058" y="374" font-size="13" font-weight="700" text-anchor="middle" class="t">User interface &amp; local I²C1 (GP26/GP27)</text>

  <rect x="890" y="388" width="164" height="60" rx="5" class="new"/>
  <text x="972" y="408" font-size="12" font-weight="600" text-anchor="middle" class="t">SSD1306 OLED</text>
  <text x="972" y="423" font-size="10.5" text-anchor="middle" class="mut">128×64 mono, SPI1</text>
  <text x="972" y="438" font-size="10" text-anchor="middle" class="mono mut">SCK 14 · MOSI 11 · DC 12</text>

  <rect x="1066" y="388" width="164" height="60" rx="5" class="new"/>
  <text x="1148" y="408" font-size="12" font-weight="600" text-anchor="middle" class="t">TCA9555PWR</text>
  <text x="1148" y="423" font-size="10.5" text-anchor="middle" class="mut">16-bit expander @ 0x20</text>
  <text x="1148" y="438" font-size="10" text-anchor="middle" class="mono mut">INT → GP28</text>

  <rect x="890" y="462" width="164" height="60" rx="5" class="keep"/>
  <text x="972" y="482" font-size="12" font-weight="600" text-anchor="middle" class="t">M24C02 EEPROM</text>
  <text x="972" y="497" font-size="10.5" text-anchor="middle" class="mut">settings @ 0x56 — on carrier</text>
  <text x="972" y="512" font-size="10" text-anchor="middle" class="mut">128 B slot at 0x20–0x9F</text>

  <rect x="1066" y="462" width="164" height="60" rx="5" class="box"/>
  <text x="1148" y="482" font-size="12" font-weight="600" text-anchor="middle" class="t">4 buttons</text>
  <text x="1148" y="497" font-size="10.5" text-anchor="middle" class="mut">to GND, internal pull-ups</text>
  <text x="1148" y="512" font-size="10" text-anchor="middle" class="mut">11 lines spare → test points</text>

  <!-- ================= POWER ================= -->
  <rect x="224" y="470" width="196" height="186" rx="7" class="pwr"/>
  <text x="322" y="491" font-size="13" font-weight="700" text-anchor="middle" class="t">Power tree</text>
  <rect x="240" y="502" width="164" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="322" y="521" font-size="11" text-anchor="middle" class="t">fuse + TVS crowbar</text>
  <rect x="240" y="538" width="164" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="322" y="557" font-size="11" text-anchor="middle" class="t">LED 5 V rail (high current)</text>
  <rect x="240" y="574" width="164" height="34" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="322" y="589" font-size="11" text-anchor="middle" class="t">Logic 5 V → D_OR → VSYS</text>
  <text x="322" y="602" font-size="9.5" text-anchor="middle" class="mut">kept off the LED rail</text><rect x="240" y="614" width="164" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/><text x="322" y="626" font-size="10.5" text-anchor="middle" class="t">LDO → 3V3_CARRIER</text><text x="322" y="638" font-size="9" text-anchor="middle" class="mut">117 mA · from VSYS</text>

  <!-- ================= WIRES ================= -->
  <!-- DMX external into front end -->
  <path class="w" d="M186 141 H 224" marker-end="url(#ar)"/>
  <path class="w" d="M186 197 H 205 V 141" />
  <!-- front end to MCU -->
  <path class="wb" d="M420 200 H 460 V 300 H 490" marker-end="url(#arB)"/>
  <text x="452" y="292" font-size="10.5" class="mono mut">RX/TX/DE</text>
  <text x="452" y="280" font-size="10" class="mut">GP8/9/10</text>

  <!-- ethernet + usb into module -->
  <path class="w" d="M186 309 H 452 V 210 H 490" marker-end="url(#ar)"/>
  <text x="300" y="303" font-size="10.5" class="mut">RJ45 is part of the module</text>
  <path class="w" d="M186 389 H 470 V 350 H 490" marker-end="url(#ar)"/>
  <text x="300" y="383" font-size="10.5" class="mut">USB on the module (Enttec widget + console)</text>

  <!-- MCU to level shifter -->
  <path class="wb" d="M820 225 H 872" marker-end="url(#arB)"/>
  <text x="846" y="216" font-size="10.5" text-anchor="middle" class="mono mut">8×</text>
  <text x="846" y="243" font-size="10" text-anchor="middle" class="mut">GP0–7</text>
  <!-- shifter to strings -->
  <path class="w" d="M1040 225 H 1080" marker-end="url(#ar)"/>

  <!-- MCU to UI -->
  <path class="wb" d="M820 430 H 846 V 420 H 872" marker-end="url(#arB)"/>
  <text x="838" y="452" font-size="10" text-anchor="middle" class="mut">SPI1 + I²C1</text>

  <!-- power flows -->
  <path class="wp" d="M186 496 H 224" marker-end="url(#arP)"/>
  <path class="wp" d="M420 591 H 452 V 505 H 490" marker-end="url(#arP)"/>
  <text x="452" y="530" font-size="10" class="mut">VSYS</text>
  <path class="wp" d="M404 553 H 456 V 660 H 1262 V 290 H 1244" marker-end="url(#arP)"/>
  <text x="640" y="654" font-size="10.5" class="mut">5 V to LED strings — per-output polyfuse, injection at the connector</text>

  <!-- 3v3 out to UI -->
  <path stroke="#059669" stroke-width="2" fill="none" d="M404 629 H 452 V 700 H 1058 V 542" marker-end="url(#ar)"/>
  <text x="660" y="694" font-size="10.5" fill="#047857">3V3_CARRIER → OLED, expander, EEPROM, and the DMX isolator PS1</text>

  <!-- footnotes -->
  <text x="36" y="726" font-size="12" font-weight="700" class="t">Notes</text>
  <text x="36" y="746" font-size="11.5" class="mut">1.  The RJ45 and USB connectors are on the W6300-EVB-Pico2 itself, not the carrier — the carrier only sockets the module.</text>
  <text x="36" y="765" font-size="11.5" class="mut">2.  The W6300 has an integrated PHY behind an unprotected magjack — the same exposure that killed the Nucleos. That failure is now permanently undiagnosed, so: socket the module, add an inline surge protector on installs,</text>
  <text x="36" y="784" font-size="11.5" class="mut">3.  WS2812 is single-wire, so Rev 1's per-channel CLK line is dropped — 8 data lines only, which is what makes 8 strings fit the pin budget.</text>
  <text x="36" y="803" font-size="11.5" class="mut">4.  All carrier 3V3 comes from an LDO on VSYS, so the module’s 3V3(OUT) carries no carrier load and works on brick or USB power alike.</text>
  <text x="36" y="850" font-size="10.5" class="mut">dmx_interface_firmware/docs/rev2-block-diagram.svg — see REV2_PLAN.md</text>
</svg>
