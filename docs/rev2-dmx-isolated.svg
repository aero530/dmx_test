<rect width="1340" height="1184" fill="#ffffff"/>
<text x="36" y="40" font-size="23" font-weight="700" class="t">Rev 2 — Isolated DMX Front End</text>
<text x="36" y="63" font-size="13.5" class="mut">Carried over from Rev 1 essentially unchanged. Only the MCU pins move (STM32 → RP2350 PIO), the opto LED resistors are re-valued, and the EN drive is reworked fail-safe (drawn at the bottom).</text>
<rect x="540" y="96" width="4" height="560" fill="none"/>
<line x1="542" y1="100" x2="542" y2="640" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="552" y="118" font-size="12" font-weight="700" fill="#7c3aed">ISOLATION BARRIER</text>
<text x="552" y="134" font-size="10.5" fill="#7c3aed">logic GND  |  GNDISO</text>
<rect x="36" y="150" width="170" height="200" rx="7" fill="#e8f1fc" stroke="#1d6fd6" stroke-width="1.8"/>
<text x="121" y="176" font-size="13" font-weight="700" text-anchor="middle" class="t">RP2350</text>
<text x="121" y="193" font-size="10.5" text-anchor="middle" class="mut">PIO2 — DmxInput.pio</text>
<text x="121" y="207" font-size="10.5" text-anchor="middle" class="mut">and DmxOutput.pio</text>
<text x="121" y="228" font-size="10" text-anchor="middle" class="mut">ported verbatim from</text>
<text x="121" y="241" font-size="10" text-anchor="middle" class="mut">rp2040_dmx</text>
