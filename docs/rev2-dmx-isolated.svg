<path class="wv" d="M664 300 H 730" marker-end="url(#av)"/>
<rect x="420" y="332" width="244" height="36" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="432" y="354" font-size="11.5" font-weight="700" class="mono t">U16</text>
<text x="542" y="347" font-size="10.5" text-anchor="middle" class="t">RX</text>
<text x="542" y="360" font-size="9.5" text-anchor="middle" class="mut">TLP2368</text>
<path class="w" d="M420 350 H 214" marker-end="url(#a)"/>
<path class="wv" d="M730 350 H 664" marker-end="url(#av)"/>
<rect x="676" y="374" width="238" height="88" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="688" y="392" font-size="11" font-weight="700" fill="#b45309">LED drive to spec + fail-safe EN</text>
<text x="688" y="406" font-size="10" class="mut">R36/R37/R39 → 220 Ω (TLP2368 ≥6.5 mA); R40/R41</text>
<text x="688" y="418" font-size="10" class="mut">output pull-ups unchanged (470 Ω, 3V3ISO).</text>
<text x="688" y="430" font-size="10" class="mut">U14 EN reworked fail-safe: LED biased ON from 3V3</text>
<text x="688" y="442" font-size="10" class="mut">via R46; Q1 (GP10 via R36, R47 hold-down) grounds</text>
<text x="688" y="454" font-size="10" class="mut">the anode to TX. Undriven GP10 = RECEIVE.</text>
<path class="w" d="M760 374 V 358" marker-end="url(#a)"/>
<rect x="730" y="150" width="200" height="220" rx="7" fill="#f3f4f6" stroke="#33383f" stroke-width="1.8"/>
<text x="830" y="176" font-size="13" font-weight="700" text-anchor="middle" class="mono t">THVD1400</text>
<text x="830" y="192" font-size="10.5" text-anchor="middle" class="mut">RS-485 transceiver</text>
<text x="830" y="206" font-size="10.5" text-anchor="middle" class="mut">on 3V3ISO</text>
<text x="742" y="254" font-size="10.5" class="mono mut">DI</text>
<text x="742" y="304" font-size="10.5" class="mono mut">DE, RE</text>
<text x="742" y="354" font-size="10.5" class="mono mut">RO</text>
<text x="918" y="264" font-size="10.5" text-anchor="end" class="mono mut">A</text>
<text x="918" y="294" font-size="10.5" text-anchor="end" class="mono mut">B</text>
<text x="830" y="336" font-size="9.5" text-anchor="middle" class="mut">internal fail-safe</text>
<rect x="972" y="150" width="196" height="220" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1070" y="174" font-size="12.5" font-weight="700" text-anchor="middle" class="t">Bias + termination</text>
<text x="1070" y="198" font-size="11" text-anchor="middle" class="mono t">R42  680 Ω → 3V3ISO</text>
<text x="1070" y="216" font-size="11" text-anchor="middle" class="mono t">R43  680 Ω → GNDISO</text>
<text x="1070" y="234" font-size="10.5" text-anchor="middle" class="mut">bias pair, always fitted —</text>
<text x="1070" y="248" font-size="10.5" text-anchor="middle" class="mut">holds A&gt;B when the bus idles</text>
<line x1="990" y1="264" x2="1150" y2="264" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3"/>
<text x="1070" y="284" font-size="11" text-anchor="middle" font-weight="600" class="t">R45 120 Ω via JP38 (N.O.)</text>
<text x="1070" y="300" font-size="10.5" text-anchor="middle" class="mut">the ONLY termination — close</text>
<text x="1070" y="314" font-size="10.5" text-anchor="middle" class="mut">only when last on the line</text>
<text x="1070" y="336" font-size="10" text-anchor="middle" class="mut">with far-end term: ≈270 mV idle</text>
<text x="1070" y="348" font-size="10" text-anchor="middle" class="mut">differential, above the 200 mV</text>
<text x="1070" y="360" font-size="10" text-anchor="middle" class="mut">threshold; open bus: full bias</text>
<path class="wv" d="M930 264 H 972"/>
<path class="wv" d="M930 294 H 972"/>
<rect x="1196" y="150" width="112" height="96" rx="6" fill="#ffffff" stroke="#33383f" stroke-width="1.8"/>
<text x="1252" y="174" font-size="12" font-weight="700" text-anchor="middle" class="t">J23</text>
<text x="1252" y="190" font-size="10.5" text-anchor="middle" class="mut">XLR-5 male</text>
<text x="1252" y="205" font-size="10.5" text-anchor="middle" class="mut">DMX IN</text>
<text x="1252" y="226" font-size="9.5" text-anchor="middle" class="mut">1 = GNDISO</text>
<text x="1252" y="238" font-size="9.5" text-anchor="middle" class="mut">2 = D− · 3 = D+</text>
<rect x="1196" y="274" width="112" height="96" rx="6" fill="#ffffff" stroke="#33383f" stroke-width="1.8"/>
<text x="1252" y="298" font-size="12" font-weight="700" text-anchor="middle" class="t">J24</text>
<text x="1252" y="314" font-size="10.5" text-anchor="middle" class="mut">XLR-5 female</text>
<text x="1252" y="329" font-size="10.5" text-anchor="middle" class="mut">DMX THRU</text>
<text x="1252" y="350" font-size="9.5" text-anchor="middle" class="mut">pins 1,2,3 (+4,5)</text>
<text x="1252" y="362" font-size="9.5" text-anchor="middle" class="mut">bussed from J23</text>
<path class="wv" d="M1168 200 H 1196"/>
<path class="wv" d="M1182 200 V 320 H 1196"/>
<circle cx="1182" cy="200" r="3" fill="#7c3aed"/>
<rect x="730" y="470" width="438" height="96" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="949" y="494" font-size="13" font-weight="700" text-anchor="middle" class="t">PS1 — 1S7BE isolated DC-DC, 1 W</text>
<text x="949" y="514" font-size="11" text-anchor="middle" class="t">→ 3V3ISO / GNDISO   ·   budget ≈ 50–60 mA worst case</text>
<text x="949" y="534" font-size="11" text-anchor="middle" fill="#047857" font-weight="600">Confirmed 3V3 input — fed from 3V3_CARRIER (the LDO on VSYS), NOT the module 3V3(OUT)</text>
<text x="949" y="552" font-size="10.5" text-anchor="middle" class="mut">C12 tantalum on 3V3ISO (10 V rating, fine at 3.3 V)</text>
<path stroke="#059669" stroke-width="2.2" fill="none" d="M420 518 H 730" marker-end="url(#a)"/>
<text x="566" y="508" font-size="11.5" text-anchor="middle" font-weight="600" class="t">3V3_CARRIER</text>
<text x="566" y="534" font-size="10.5" text-anchor="middle" class="mut">≈90 mA in — the largest single load</text>
<text x="566" y="548" font-size="10.5" text-anchor="middle" class="mut">on the carrier 3V3 rail</text>
<rect x="36" y="600" width="620" height="204" rx="7" fill="#fbfbfa" stroke="#d4d8dd"/>
<text x="52" y="624" font-size="13" font-weight="700" class="t">Grounding scheme (unchanged)</text>
<text x="52" y="648" font-size="11.5" class="mut">XLR shells  →  CHGND  →  R1 (0 Ω)  →  logic GND</text>
<text x="52" y="665" font-size="11.5" class="mut">XLR pin 1   →  GNDISO  (the isolated side)</text>
<text x="52" y="682" font-size="11.5" class="mut"></text>
<text x="52" y="699" font-size="11.5" class="mut">R1 stays the tuning point: fit it for a solid chassis reference, or</text>
<text x="52" y="716" font-size="11.5" class="mut">lift it if a ground loop through the shield causes trouble in an install.</text>
<text x="52" y="733" font-size="11.5" class="mut"></text>
<text x="52" y="750" font-size="11.5" class="mut">This is the reason the DMX side survives ground-potential differences</text>
<text x="52" y="767" font-size="11.5" class="mut">that would otherwise take out the transceiver. Ethernet has no</text>
<text x="52" y="784" font-size="11.5" class="mut">equivalent protection — see the notes in REV2_PLAN.md.</text>
<rect x="680" y="600" width="628" height="204" rx="7" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
<text x="696" y="624" font-size="13" font-weight="700" fill="#0369a1">What changes in Rev 2</text>
<text x="696" y="648" font-size="11.5" class="t">The RP2040 DMX bridge is deleted. DMX moves in-process onto PIO2 of</text>
<text x="696" y="665" font-size="11.5" class="t">the RP2350, so the I²C bridge protocol, its 30 ms poll and the whole</text>
<text x="696" y="682" font-size="11.5" class="t">class of bugs review §1.1/§1.2 found in that link all disappear.</text>
<text x="696" y="699" font-size="11.5" class="t"></text>
<text x="696" y="716" font-size="11.5" class="t">MCU pins: GP8 = RX, GP9 = TX, GP10 = direction — all PIO-timed,</text>
<text x="696" y="733" font-size="11.5" class="t">so the existing DmxInput.pio and DmxOutput.pio move over verbatim.</text>
<text x="696" y="750" font-size="11.5" class="t"></text>
<text x="696" y="767" font-size="11.5" class="t">GP10 drives Q1, not the opto LED: undriven = RECEIVE (fail-safe),</text>
<text x="696" y="784" font-size="11.5" class="t">HIGH = TRANSMIT. Direction stays on a real GPIO (per-frame timing).</text>
<rect x="36" y="834" width="1272" height="310" rx="7" fill="#fffdf5" stroke="#b45309" stroke-width="1.6"/>
<text x="52" y="862" font-size="13.5" font-weight="700" fill="#b45309">Fail-safe direction drive — as drawn on the Rev 2 DMX sheet (R46 / R47 / Q1 new, R36 reused as gate resistor)</text>
<text x="100" y="918" font-size="12" font-weight="700" text-anchor="end" class="mono t">3V3</text>
<path class="w" d="M104 914 H 150"/>
<path class="w" d="M 150 914 L 158 914 L 161.667 907 L 169 921 L 176.333 907 L 183.667 921 L 191 907 L 198.333 921 L 202 914 L 210 914"/>
<text x="180" y="900" font-size="11" text-anchor="middle" class="mono t">R46</text>
<text x="180" y="936" font-size="10.5" text-anchor="middle" class="mut">220R</text>
<path class="w" d="M210 914 H 390"/>
<circle cx="330" cy="914" r="3" fill="#33383f"/>
<text x="330" y="900" font-size="11" text-anchor="middle" class="mono t">EN_LED</text>
<polygon points="390,905 390,923 408,914" fill="#ffffff" stroke="#33383f" stroke-width="1.5"/>
<path class="w" d="M408 905 V 923 M408 914 H 452"/>
<path class="w" d="M404 902 L 416 888 M412 904 L 424 890" marker-end="url(#a)"/>
<text x="399" y="940" font-size="11" text-anchor="middle" class="mono t">U14 LED</text>
<text x="399" y="954" font-size="10" text-anchor="middle" class="mut">EN opto, 1-3</text>
<path class="w" d="M 452 914 V 922 M 442 922 H 462 M 446 926 H 458 M 449.5 930 H 454.5"/>
<path class="w" d="M330 914 V 1003"/>
<path class="w" d="M318 1003 H 330"/>
<path class="w" d="M318 1035 H 330 M330 1035 V 1049"/>
<path class="w" d="M 330 1049 V 1057 M 320 1057 H 340 M 324 1061 H 336 M 327.5 1065 H 332.5"/>
<path class="w" d="M318 997 V 1011 M318 1013 V 1025 M318 1027 V 1041"/>
<path class="w" d="M310 997 V 1041"/>
<polygon points="328,1031 320,1035 328,1039" fill="#33383f"/>
<text x="345" y="1015" font-size="11.5" font-weight="700" class="mono t">Q1</text>
<text x="345" y="1030" font-size="10.5" class="mut">2N7002</text>
<text x="100" y="1023" font-size="12" font-weight="700" text-anchor="end" class="mono t">GP10</text>
<path class="w" d="M104 1019 H 150"/>
<path class="w" d="M 150 1019 L 158 1019 L 161.667 1012 L 169 1026 L 176.333 1012 L 183.667 1026 L 191 1012 L 198.333 1026 L 202 1019 L 210 1019"/>
<text x="180" y="1005" font-size="11" text-anchor="middle" class="mono t">R36</text>
<text x="180" y="1043" font-size="10.5" text-anchor="middle" class="mut">220R (Rev 1 part, reused)</text>
<path class="w" d="M210 1019 H 310"/>
<circle cx="260" cy="1019" r="3" fill="#33383f"/>
<text x="260" y="1005" font-size="11" text-anchor="middle" class="mono t">EN_GATE</text>
<path class="w" d="M260 1019 V 1039"/>
<path class="w" d="M 260 1039 L 260 1045 L 253 1047.75 L 267 1053.25 L 253 1058.75 L 267 1064.25 L 253 1069.75 L 267 1075.25 L 260 1078 L 260 1084"/>
<text x="243" y="1059" font-size="11" text-anchor="end" class="mono t">R47</text>
<text x="243" y="1073" font-size="10.5" text-anchor="end" class="mut">100k</text>
<path class="w" d="M 260 1084 V 1092 M 250 1092 H 270 M 254 1096 H 266 M 257.5 1100 H 262.5"/>
<text x="560" y="880" font-size="11.5" font-weight="700" class="t">GP10 undriven or LOW → Q1 off → 3V3 drives 8 mA through R46 + LED → opto ON → DE/RE low = RECEIVE</text>
<text x="560" y="898" font-size="11.5" font-weight="400" class="mut">the fail-safe state: boot, reset, BOOTSEL/reflash, firmware crash, module absent — all land here</text>
<text x="560" y="928" font-size="11.5" font-weight="700" class="t">GP10 HIGH → Q1 on → EN_LED node grounded → LED off → R40 (3V3ISO) pulls DE/RE high = TRANSMIT</text>
<text x="560" y="946" font-size="11.5" font-weight="400" class="mut">15 mA flows 3V3 → R46 → Q1 only while transmitting; GP10 itself sources only Q1 gate leakage</text>
<text x="560" y="976" font-size="11.5" font-weight="400" class="mut">R36 keeps its Rev 1 position (GP10 → R36) and becomes the gate series resistor; R47 defines the</text>
<text x="560" y="994" font-size="11.5" font-weight="400" class="mut">gate while GP10 floats. Firmware convention unchanged: GP10 HIGH = TX, LOW/Hi-Z = RX.</text>
<text x="560" y="1024" font-size="11.5" font-weight="400" class="mut">The isolated side is untouched: U14 open-collector output + R40 470R pull-up → THVD1400 DE and /RE,</text>
<text x="560" y="1042" font-size="11.5" font-weight="400" class="mut">exactly as Rev 1 drew it. All new parts live on the logic side of the barrier.</text>
<text x="560" y="1072" font-size="11.5" font-weight="400" class="mut">Replaces the Rev 1 topology (GP10 sinks the LED directly), which was fail-safe-TRANSMIT — every</text>
<text x="560" y="1090" font-size="11.5" font-weight="400" class="mut">boot had a ms-scale window where a floating GP10 let R40 enable the RS-485 driver onto the bus.</text>
<text x="1304" y="1170" font-size="10.5" text-anchor="end" class="mut">dmx_interface_firmware/docs/rev2-dmx-isolated.svg</text>
</svg>