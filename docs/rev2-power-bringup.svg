<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33383f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><style>.t{fill:#1f2328}.mut{fill:#5b6570}.mono{font-family:ui-monospace,Consolas,monospace}.w{stroke:#33383f;stroke-width:1.6;fill:none}.wo{stroke:#b45309;stroke-width:2.4;fill:none}.wg{stroke:#059669;stroke-width:2.2;fill:none}.wd{stroke:#7c3aed;stroke-width:1.8;fill:none;stroke-dasharray:6 4}</style></defs>
<rect width="1400" height="1060" fill="#ffffff"/>
<text x="36" y="40" font-size="23" font-weight="700" class="t">Rev 2 — Power Bring-Up and Sequencing</text>
<text x="36" y="63" font-size="13.5" class="mut">Rise order is enforced by construction: every rail follows passively except carrier 3V3, which is gated by the module IOVDD through the LDO enable (R61).</text>
<text x="36" y="100" font-size="13" font-weight="700" class="mut">RISE ORDER (brick power)</text>
<rect x="36" y="118" width="150" height="72" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="111" y="139" font-size="12.5" font-weight="700" text-anchor="middle" class="t">5 V input</text>
<text x="111" y="157" font-size="10.5" text-anchor="middle" class="mut">J1 → F1 → D2 TVS</text>
<text x="111" y="171" font-size="10.5" text-anchor="middle" class="mut">rail: +5V_LED</text>
<text x="111" y="185" font-size="10.5" text-anchor="middle" class="mut">t ≈ 0 (brick slew)</text>
<circle cx="50" cy="118" r="11" fill="#1f2328"/>
<text x="50" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<rect x="36" y="214" width="150" height="72" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="111" y="235" font-size="12.5" font-weight="700" text-anchor="middle" class="t">+5V_SHIFT</text>
<text x="111" y="253" font-size="10.5" text-anchor="middle" class="mut">FB2, passive follow</text>
<text x="111" y="267" font-size="10.5" text-anchor="middle" class="mut">U10 level shifter</text>
<text x="111" y="281" font-size="10.5" text-anchor="middle" class="mut">rises with 1</text>
<circle cx="50" cy="214" r="11" fill="#1f2328"/>
<text x="50" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<rect x="232" y="118" width="150" height="72" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="307" y="139" font-size="12.5" font-weight="700" text-anchor="middle" class="t">+5V_LOGIC</text>
<text x="307" y="157" font-size="10.5" text-anchor="middle" class="mut">FB1 + C3</text>
<text x="307" y="171" font-size="10.5" text-anchor="middle" class="mut">passive follow</text>
<text x="307" y="185" font-size="10.5" text-anchor="middle" class="mut">rises with 1</text>
<circle cx="246" cy="118" r="11" fill="#1f2328"/>
<text x="246" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<rect x="428" y="118" width="150" height="72" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="503" y="139" font-size="12.5" font-weight="700" text-anchor="middle" class="t">VSYS</text>
<text x="503" y="157" font-size="10.5" text-anchor="middle" class="mut">D1 PMEG2010 −0.35 V</text>
<text x="503" y="171" font-size="10.5" text-anchor="middle" class="mut">≈ 4.65 V (brick)</text>
<text x="503" y="185" font-size="10.5" text-anchor="middle" class="mut">also fed by USB D1</text>
<circle cx="442" cy="118" r="11" fill="#1f2328"/>
<text x="442" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<rect x="624" y="118" width="170" height="72" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
<text x="709" y="139" font-size="12.5" font-weight="700" text-anchor="middle" class="t">3V3_OUT (module)</text>
<text x="709" y="157" font-size="10.5" text-anchor="middle" class="mut">RT6150 buck-boost</text>
<text x="709" y="171" font-size="10.5" text-anchor="middle" class="mut">soft-start, ms scale</text>
<text x="709" y="185" font-size="10.5" text-anchor="middle" class="mut">IOVDD of the RP2350</text>
<circle cx="638" cy="118" r="11" fill="#1f2328"/>
<text x="638" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<rect x="864" y="118" width="170" height="86" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
<text x="949" y="139" font-size="12.5" font-weight="700" text-anchor="middle" class="t">3V3 (carrier)</text>
<text x="949" y="157" font-size="10.5" text-anchor="middle" class="mut">TLV75733, start ≈ 0.2 ms</text>
<text x="949" y="171" font-size="10.5" text-anchor="middle" class="mut">EN gated: waits for 4</text>
<text x="949" y="185" font-size="10.5" text-anchor="middle" class="mut">OLED · TCA9555 · EEPROM</text>
<text x="949" y="199" font-size="10.5" text-anchor="middle" class="mut">pull-ups · opto anodes</text>
<circle cx="878" cy="118" r="11" fill="#1f2328"/>
<text x="878" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<rect x="1104" y="118" width="170" height="72" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1189" y="139" font-size="12.5" font-weight="700" text-anchor="middle" class="t">3V3ISO</text>
<text x="1189" y="157" font-size="10.5" text-anchor="middle" class="mut">PS1 GAPTEC 1S7BE</text>
<text x="1189" y="171" font-size="10.5" text-anchor="middle" class="mut">in-range 2.97–3.63 V</text>
<text x="1189" y="185" font-size="10.5" text-anchor="middle" class="mut">THVD1400 + RX opto</text>
<circle cx="1118" cy="118" r="11" fill="#1f2328"/>
<text x="1118" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<path class="wo" d="M186 154 H 232" marker-end="url(#ao)"/>
<path class="wo" d="M382 154 H 428" marker-end="url(#ao)"/>
<path class="wo" d="M111 190 V 214"/>
<path class="wo" d="M578 154 H 624" marker-end="url(#ao)"/>
<path class="wg" d="M794 154 H 864" marker-end="url(#ag)"/>
<text x="828" y="146" font-size="10.5" text-anchor="middle" font-weight="700" fill="#047857">EN ≥ 1.0 V</text>
<text x="828" y="160" font-size="9.5" text-anchor="middle" class="mut">via R61</text>
<path class="wg" d="M1034 161 H 1104" marker-end="url(#ag)"/>
<text x="500" y="238" font-size="11.5" class="t">USB-only: VBUS → module D1 → VSYS. Chain 4→5→6 unchanged; rails 1/2 stay dark — strips off, logic and DMX fully alive.</text>
<text x="500" y="256" font-size="11.5" class="t">Power-down: RT6150 is a buck-boost and holds IOVDD to VSYS ≈ 1.8 V, so the module outlives the carrier rail — injection-free in both directions.</text>
<rect x="36" y="292" width="640" height="140" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="52" y="316" font-size="13" font-weight="700" fill="#dc2626">Why the EN gate exists (fixed this review)</text>
<text x="52" y="340" font-size="11.5" class="t">Ungated, the TLV75733 (0.2 ms start) beats the RT6150 (ms soft-start) at every power-up.</text>
<text x="52" y="357" font-size="11.5" class="t">During the gap the carrier rail back-injects into unpowered, non-failsafe RP2350 pads:</text>
<text x="52" y="374" font-size="11.5" class="t">   I2C pull-ups 2 x 2k2 ≈ 1.5 mA each · INT 10k ≈ 0.3 mA · opto anodes via LED + 220R ≈ 6 mA each</text>
<text x="52" y="391" font-size="11.5" class="t">≈ 15 mA total through pad ESD structures, every boot. The gate makes the carrier rail rise</text>
<text x="52" y="408" font-size="11.5" class="t">strictly after IOVDD. R62 (DNP) restores an ungated LDO for module-less power-tree bench work.</text>
<rect x="712" y="292" width="562" height="140" rx="7" fill="#fbfbfa" stroke="#d4d8dd"/>
<text x="728" y="316" font-size="13" font-weight="700" class="t">Datasheet numbers this diagram relies on</text>
<text x="728" y="340" font-size="11.5" class="mut">TLV75733 (P): EN guaranteed on ≥ 1.0 V / off ≤ 0.3 V, INTERNAL EN pull-down — module out = LDO off</text>
<text x="728" y="357" font-size="11.5" class="mut">GAPTEC 1S7BE-0303S3U: input window 2.97–3.63 V, 303 mA out, 76% efficient (1 W)</text>
<text x="728" y="374" font-size="11.5" class="mut">TLP2368: open-collector, threshold IF 5 mA → 220R/270R give 8.0/6.5 mA</text>
<text x="728" y="391" font-size="11.5" class="mut">TCA9555: internal 100k pull-ups confirmed, IOL 25 mA, power-on = all inputs</text>
<text x="728" y="408" font-size="11.5" class="mut">SN74AHCT245: inputs rated to 7 V independent of VCC — USB-only drive into dead U10 is legal</text>
<text x="36" y="470" font-size="13" font-weight="700" class="mut">BRING-UP PROCEDURE — measure at the test points, in this order</text>
<rect x="36" y="482" width="1338" height="24" rx="4" fill="#f3f4f6"/>
<text x="42" y="499" font-size="11.5" font-weight="700" class="t">Stage</text>
<text x="102" y="499" font-size="11.5" font-weight="700" class="t">Fit / apply</text>
<text x="396" y="499" font-size="11.5" font-weight="700" class="t">Expect</text>
<text x="906" y="499" font-size="11.5" font-weight="700" class="t">Pass criteria / notes</text>
<circle cx="52" cy="532" r="11" fill="#1f2328"/>
<text x="52" y="536" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">0</text>
<text x="102" y="528" font-size="11" class="t">Bare board, NO module, brick on. (Fit R62 only</text>
<text x="102" y="542" font-size="11" class="t">if the LDO itself must be tested now.)</text>
<text x="396" y="528" font-size="10.5" class="mono t">+5V_LED 5.0 V · VSYS ≈ 4.65 V · 3V3 = 0 V by design (EN gated) · idle under 5</text>
<text x="396" y="542" font-size="10.5" class="mono t">mA</text>
<text x="906" y="528" font-size="11" class="mut">No smoke test for the input chain. 3V3 present here = R61/R62 error. U10</text>
<text x="906" y="542" font-size="11" class="mut">inputs are held low by R63-R70, so the string outputs idle safely even</text>
<text x="906" y="556" font-size="11" class="mut">with no module.</text>
<line x1="36" y1="586" x2="1374" y2="586" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="52" cy="610" r="11" fill="#1f2328"/>
<text x="52" y="614" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="102" y="606" font-size="11" class="t">Module fitted, brick on. Nothing else</text>
<text x="102" y="620" font-size="11" class="t">connected.</text>
<text x="396" y="606" font-size="10.5" class="mono t">VSYS 4.65 V · 3V3_OUT 3.30 V · 3V3 3.30 V · 3V3ISO ≈ 3.3 V · ~250–350 mA</text>
<text x="906" y="606" font-size="11" class="mut">Heartbeat LED blinks. Scope 3V3 vs 3V3_OUT rise: carrier must lag module.</text>
<line x1="36" y1="664" x2="1374" y2="664" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="52" cy="688" r="11" fill="#1f2328"/>
<text x="52" y="692" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="102" y="684" font-size="11" class="t">USB only — brick disconnected.</text>
<text x="396" y="684" font-size="10.5" class="mono t">VSYS ≈ 4.4–4.7 V · +5V_LED = 0 · 3V3 up · ≈ 280 mA from VBUS</text>
<text x="906" y="684" font-size="11" class="mut">UI, EEPROM, DMX all alive; strips dark. This is the bench-debug mode.</text>
<line x1="36" y1="742" x2="1374" y2="742" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="52" cy="766" r="11" fill="#1f2328"/>
<text x="52" y="770" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="102" y="762" font-size="11" class="t">Brick + one short strip on J10, then all</text>
<text x="102" y="776" font-size="11" class="t">eight.</text>
<text x="396" y="762" font-size="10.5" class="mono t">Per-string current per configuration; PF cold-resistance drop under 50 mV</text>
<text x="906" y="762" font-size="11" class="mut">Scope +5V_LED during full-white step and power-on: transients are the old</text>
<text x="906" y="776" font-size="11" class="mut">Nucleo-killer suspect — measure, do not assume.</text>
<line x1="36" y1="820" x2="1374" y2="820" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="52" cy="844" r="11" fill="#1f2328"/>
<text x="52" y="848" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="102" y="840" font-size="11" class="t">DMX loop: console into J23, fixture on J24.</text>
<text x="396" y="840" font-size="10.5" class="mono t">3V3ISO under TX load ≥ 3.15 V · U14 LED ≈ 8 mA idle, 0 with GP10 high · EN_LED</text>
<text x="396" y="854" font-size="10.5" class="mono t">node 1.55 V idle, under 0.2 V in TX</text>
<text x="906" y="840" font-size="11" class="mut">Direction is fail-safe: R46 biases U14 on (RECEIVE) with GP10 undriven —</text>
<text x="906" y="854" font-size="11" class="mut">verify DE stays low through reset and reflash; GP10 high (Q1 on) must flip</text>
<text x="906" y="868" font-size="11" class="mut">DE high.</text>
<line x1="36" y1="898" x2="1374" y2="898" stroke="#e5e7eb" stroke-width="1"/>
<text x="36" y="926" font-size="11.5" class="mut">Rails and their owners:  +5V_LED / +5V_SHIFT — fuse+TVS crowbar, strips and U10 · +5V_LOGIC — FB1+C3, exists only to feed D1 · VSYS — diode-OR of brick and USB · 3V3_OUT — module RT6150, feeds R61 EN gate + TP7 only</text>
<text x="36" y="944" font-size="11.5" class="mut">3V3 — TLV75733, all carrier logic incl. PS1 · 3V3ISO / GNDISO — PS1 isolated island, THVD1400 side · CHGND — XLR shells, bonded via R60 (0R) / C16 (DNP).</text>
<text x="1380" y="1044" font-size="10.5" text-anchor="end" class="mut">dmx_interface_firmware/docs/rev2-power-bringup.svg</text>
</svg>