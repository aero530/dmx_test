<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1010" viewBox="0 0 1360 1010" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33383f"/></marker><style>.t{fill:#1f2328}.mut{fill:#5b6570}.mono{font-family:ui-monospace,Consolas,monospace}.w5{stroke:#b45309;stroke-width:2.6;fill:none}.w5t{stroke:#b45309;stroke-width:1.8;fill:none}.w3{stroke:#059669;stroke-width:2.2;fill:none}.wk{stroke:#33383f;stroke-width:1.5;fill:none}</style></defs>
<rect width="1360" height="1010" fill="#ffffff"/>
<text x="36" y="40" font-size="23" font-weight="700" class="t">Rev 2 — Power Tree</text>
<text x="36" y="63" font-size="13.5" class="mut">One carrier 3V3 rail from an LDO on VSYS. 3V3(OUT) feeds the module only, so the RT6150 budget stops being a design risk.</text>
<text x="36" y="106" font-size="12" font-weight="700" class="mut">INPUT PROTECTION</text>
<rect x="36" y="120" width="150" height="70" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="111" y="142" font-size="12.5" font-weight="700" text-anchor="middle" class="t">J1 — DC in</text>
<text x="111" y="160" font-size="10.5" text-anchor="middle" class="mut">5 V brick</text>
<text x="111" y="175" font-size="10.5" text-anchor="middle" class="mut">size to LED load</text>
<rect x="216" y="120" width="140" height="70" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="286" y="142" font-size="12.5" font-weight="700" text-anchor="middle" class="t">F1 fuse</text>
<text x="286" y="160" font-size="10.5" text-anchor="middle" class="mut">ATO holder</text>
<text x="286" y="175" font-size="10.5" text-anchor="middle" class="mut">sized per install</text>
<rect x="386" y="120" width="140" height="70" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="456" y="142" font-size="12.5" font-weight="700" text-anchor="middle" class="t">TVS SMAJ5.0A</text>
<text x="456" y="160" font-size="10.5" text-anchor="middle" class="mut">surge clamp; conducts</text>
<text x="456" y="175" font-size="10.5" text-anchor="middle" class="mut">fwd on reverse - blows F1</text>
<rect x="556" y="120" width="140" height="70" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="626" y="142" font-size="12.5" font-weight="700" text-anchor="middle" class="t">Bulk</text>
<text x="626" y="160" font-size="10.5" text-anchor="middle" class="mut">low-ESR</text>
<text x="626" y="175" font-size="10.5" text-anchor="middle" class="mut">at the split</text>
<path class="w5" d="M186 155 H 216" marker-end="url(#a)"/>
<path class="w5" d="M356 155 H 386" marker-end="url(#a)"/>
<path class="w5" d="M526 155 H 556" marker-end="url(#a)"/>
<path class="w5" d="M696 155 H 740 V 210"/>
<circle cx="740" cy="210" r="5" fill="#b45309"/>
<text x="752" y="205" font-size="11.5" font-weight="600" class="t">5 V split</text>
<path class="w5" d="M740 210 H 900 V 246" marker-end="url(#a)"/>
<rect x="800" y="246" width="250" height="70" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="925" y="268" font-size="12.5" font-weight="700" text-anchor="middle" class="t">LED 5 V rail</text>
<text x="925" y="286" font-size="10.5" text-anchor="middle" class="mut">high current, wide pour</text>
<text x="925" y="301" font-size="10.5" text-anchor="middle" class="mut">4800 LEDs x 60 mA = 288 A theoretical</text>
<path class="w5" d="M1050 281 H 1090" marker-end="url(#a)"/>
<rect x="1090" y="246" width="236" height="70" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="1208" y="268" font-size="12.5" font-weight="700" text-anchor="middle" class="t">8x polyfuse</text>
<text x="1208" y="286" font-size="10.5" text-anchor="middle" class="mut">one per output — review §3.7</text>
<text x="1208" y="301" font-size="10.5" text-anchor="middle" class="mut">J_LED1 … J_LED8</text>
<path class="w5t" d="M860 316 V 356" marker-end="url(#a)"/>
<rect x="800" y="356" width="250" height="82" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="925" y="378" font-size="12.5" font-weight="700" text-anchor="middle" class="t">5V_LVL_SHIFT</text>
<text x="925" y="396" font-size="10.5" text-anchor="middle" class="mut">from the LED rail, not VSYS —</text>
<text x="925" y="411" font-size="10.5" text-anchor="middle" class="mut">so the shifter output swing tracks</text>
<text x="925" y="426" font-size="10.5" text-anchor="middle" class="mut">the same rail WS2812 VIH references</text>
<text x="925" y="456" font-size="10.5" text-anchor="middle" class="mut">→ SN74ACT245 VCC · 100 nF per pin + local bulk</text>
<path class="w5" d="M740 210 H 250 V 318"/>
<path d="M236 332 L 236 360 L 264 346 Z" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<line x1="264" y1="332" x2="264" y2="360" stroke="#b45309" stroke-width="2.6"/>
<text x="180" y="342" font-size="11.5" font-weight="700" class="t">D_OR</text>
<text x="180" y="356" font-size="10" class="mut">PMEG2010AEH</text>
<path class="w5" d="M250 360 V 404 H 625 V 452" marker-end="url(#a)"/>
<rect x="120" y="452" width="620" height="286" rx="9" fill="#e8f1fc" stroke="#1d6fd6" stroke-width="1.8"/>
<text x="430" y="478" font-size="14" font-weight="700" text-anchor="middle" class="t">W6300-EVB-Pico2 — internal</text>
<rect x="150" y="494" width="130" height="44" rx="6" fill="#ffffff" stroke="#33383f" stroke-width="1.7"/>
<text x="215" y="516" font-size="11.5" font-weight="700" text-anchor="middle" class="t">VBUS  (40)</text>
<text x="215" y="534" font-size="10.5" text-anchor="middle" class="mut">USB 5 V</text>
<path d="M316 500 L 316 528 L 340 514 Z" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="340" y1="500" x2="340" y2="528" stroke="#6b7280" stroke-width="2.2"/>
<text x="328" y="546" font-size="10" text-anchor="middle" class="mut">D1 internal</text>
<path class="wk" d="M280 514 H 316"/>
<path class="wk" d="M340 514 H 560" marker-end="url(#ak)"/>
<rect x="560" y="494" width="150" height="44" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="635" y="516" font-size="11.5" font-weight="700" text-anchor="middle" class="t">VSYS  (39)</text>
<text x="635" y="534" font-size="10.5" text-anchor="middle" class="mut">1.8–5.5 V</text>
<rect x="330" y="578" width="220" height="56" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.7"/>
<text x="440" y="600" font-size="12.5" font-weight="700" text-anchor="middle" class="t">RT6150 buck-boost</text>
<text x="440" y="618" font-size="10.5" text-anchor="middle" class="mut">holds 3V3 even as VSYS sags</text>
<path class="w5" d="M635 538 V 558 H 440 V 578" marker-end="url(#a)"/>
<rect x="330" y="660" width="220" height="40" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.7"/>
<text x="440" y="682" font-size="12" font-weight="700" text-anchor="middle" class="t">3V3(OUT)  (36)</text>
<path class="w3" d="M440 634 V 660" marker-end="url(#ag)"/>
<text x="440" y="720" font-size="11" text-anchor="middle" font-weight="600" class="t">module only — RP2350 + W6300 ≈ 200 mA</text>
<text x="150" y="686" font-size="10.5" class="mut">3V3_EN (37) n/c</text>
<text x="150" y="702" font-size="10.5" class="mut">VBUS (40) n/c on carrier</text>
<path class="w5" d="M710 516 H 790" marker-end="url(#a)"/>
<rect x="790" y="486" width="250" height="92" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="915" y="510" font-size="13.5" font-weight="700" text-anchor="middle" class="t">LDO  5 V → 3V3_CARRIER</text>
<text x="915" y="529" font-size="11.5" text-anchor="middle" font-weight="600" class="mono t">TLV75733PDYDR</text>
<text x="915" y="546" font-size="10.5" text-anchor="middle" class="mut">SOT-23-5 + thermal pad · 60.3 °C/W · 1 A</text>
<text x="915" y="562" font-size="10.5" text-anchor="middle" class="mut">EN ← module 3V3_OUT (R61, sequencing) · pad to GND pour</text>
<text x="1054" y="498" font-size="10.5" class="mut">fed from VSYS, not the brick —</text>
<text x="1054" y="513" font-size="10.5" class="mut">VSYS is already the diode-OR, so the</text>
<text x="1054" y="528" font-size="10.5" class="mut">UI, EEPROM and DMX all still work</text>
<text x="1054" y="543" font-size="10.5" class="mut">on USB-only bench power</text>
<text x="1054" y="563" font-size="10.5" class="t">Headroom at worst case 4.40 V in:</text>
<text x="1054" y="577" font-size="10.5" class="mut">4.40 − 0.45 = 3.95 V, and 0.45 V is the</text>
<text x="1054" y="591" font-size="10.5" class="mut">1 A figure — at 117 mA it is ~50 mV</text>
<path class="w3" d="M915 578 V 612" marker-end="url(#ag)"/>
<rect x="770" y="612" width="556" height="196" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
<text x="1048" y="636" font-size="13.5" font-weight="700" text-anchor="middle" class="t">3V3_CARRIER — 117 mA total</text>
<text x="792" y="664" font-size="11.5" class="t">PS1 1S7BE input (3V3 in → 3V3ISO)</text>
<text x="1108" y="664" font-size="11.5" text-anchor="end" class="mono t">≈ 90 mA</text>
<text x="1124" y="664" font-size="10" class="mut">largest load; derived, measure it</text>
<text x="792" y="686" font-size="11.5" class="t">SSD1306 OLED</text>
<text x="1108" y="686" font-size="11.5" text-anchor="end" class="mono t">20 mA</text>
<text x="1124" y="686" font-size="10" class="mut">SPI, ~1 ms redraw</text>
<text x="792" y="708" font-size="11.5" class="t">I²C pull-ups 2 × 2k2</text>
<text x="1108" y="708" font-size="11.5" text-anchor="end" class="mono t">3 mA</text>
<text x="792" y="730" font-size="11.5" class="t">TCA9555 + INT pull-up</text>
<text x="1108" y="730" font-size="11.5" text-anchor="end" class="mono t">2 mA</text>
<text x="792" y="752" font-size="11.5" class="t">M24C02 EEPROM</text>
<text x="1108" y="752" font-size="11.5" text-anchor="end" class="mono t">2 mA</text>
<text x="1124" y="752" font-size="10" class="mut">active</text>
<line x1="792" y1="782" x2="1304" y2="782" stroke="#059669" stroke-width="1"/>
<text x="792" y="800" font-size="11.5" font-weight="700" class="t">3V3(OUT) carrier load</text>
<text x="1108" y="800" font-size="11.5" text-anchor="end" font-weight="700" class="mono t">0 mA</text>
<rect x="36" y="766" width="700" height="212" rx="7" fill="#fbfbfa" stroke="#d4d8dd"/>
<text x="52" y="790" font-size="13" font-weight="700" class="t">Why the LDO sits on VSYS - and where reverse protection went</text>
<text x="52" y="812" font-size="11" class="mut">VSYS is the diode-OR node: brick through D_OR, USB through the module's D1.</text>
<text x="52" y="827" font-size="11" class="mut">Tapping it means one 3V3 rail that is alive on brick power, USB power or both.</text>
<text x="52" y="842" font-size="11" class="mut">Feeding the LDO from the brick instead would leave the OLED, buttons, EEPROM</text>
<text x="52" y="857" font-size="11" class="mut">and the whole DMX side dead whenever you are running on USB at the bench.</text>
<text x="52" y="872" font-size="11" class="mut"></text>
<text x="52" y="887" font-size="11" class="mut">USB-only budget: module ≈165 mA from VSYS + carrier 117 mA ≈ 282 mA from VBUS.</text>
<text x="52" y="902" font-size="11" class="mut">Inside the 500 mA USB allowance. The LED strings obviously do not run on USB,</text>
<text x="52" y="917" font-size="11" class="mut">but everything you need to debug does.</text>
<text x="52" y="932" font-size="11" class="mut"></text>
<text x="52" y="947" font-size="11" class="mut">Reverse protection: no series P-FET. A FET rated for the LED rail is expensive</text>
<text x="52" y="962" font-size="11" class="mut">and thermally awkward at tens of amps; instead the TVS conducts forward on a</text>
<text x="52" y="977" font-size="11" class="mut">reversed brick and blows F1 (crowbar), and the D_OR Schottky already blocks</text>
<text x="52" y="992" font-size="11" class="mut">reverse into VSYS. Strips see about -1 V for the clearing time of the fuse.</text>
<rect x="36" y="214" width="170" height="196" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="121" y="238" font-size="12.5" font-weight="700" text-anchor="middle" fill="#dc2626">Deleted</text>
<text x="52" y="258" font-size="10.5" class="t">U11</text>
<text x="52" y="271" font-size="10.5" class="t">  carrier 3V3 reg</text>
<text x="52" y="284" font-size="10.5" class="t">  (R-78K3.3-1.0)</text>
<text x="52" y="297" font-size="10.5" class="t"></text>
<text x="52" y="310" font-size="10.5" class="t">U14</text>
<text x="52" y="323" font-size="10.5" class="t">  AP74700 ideal</text>
<text x="52" y="336" font-size="10.5" class="t">  diode — never</text>
<text x="52" y="349" font-size="10.5" class="t">  worked, needs</text>
<text x="52" y="362" font-size="10.5" class="t">  ~4 V anode</text>
<text x="52" y="375" font-size="10.5" class="t"></text>
<text x="52" y="388" font-size="10.5" class="t">R?</text>
<text x="52" y="401" font-size="10.5" class="t">  0 Ω tie to the</text>
<text x="52" y="414" font-size="10.5" class="t">  Nucleo 3V3 pin</text>
<text x="1324" y="996" font-size="10.5" text-anchor="end" class="mut">dmx_interface_firmware/docs/rev2-power-tree.svg</text>
</svg>