<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="880" viewBox="0 0 1320 880" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33383f"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><style>.t{fill:#1f2328}.mut{fill:#5b6570}.mono{font-family:ui-monospace,Consolas,monospace}.w{stroke:#33383f;stroke-width:1.5;fill:none}.wg{stroke:#059669;stroke-width:2;fill:none}.wc{stroke:#0891b2;stroke-width:1.8;fill:none}</style></defs>
<rect width="1320" height="880" fill="#ffffff"/>
<text x="36" y="40" font-size="23" font-weight="700" class="t">Rev 2 — User Interface, I²C1 Bus and Expander</text>
<text x="36" y="63" font-size="13.5" class="mut">Four buttons and the OLED reset move onto a TCA9555, costing one GPIO (INT) and freeing GP13 as the board's only spare.</text>
<rect x="36" y="120" width="164" height="300" rx="7" fill="#e8f1fc" stroke="#1d6fd6" stroke-width="1.8"/>
<text x="118" y="146" font-size="13" font-weight="700" text-anchor="middle" class="t">RP2350</text>
<text x="118" y="163" font-size="10.5" text-anchor="middle" class="mut">core 1 owns the UI</text>
<text x="190" y="204" font-size="10.5" text-anchor="end" class="mono t">GP14  SPI1 SCK</text>
<text x="190" y="230" font-size="10.5" text-anchor="end" class="mono t">GP11  SPI1 TX</text>
<text x="190" y="256" font-size="10.5" text-anchor="end" class="mono t">GP12  DC</text>
<text x="190" y="310" font-size="10.5" text-anchor="end" class="mono t">GP26  I2C1 SDA</text>
<text x="190" y="336" font-size="10.5" text-anchor="end" class="mono t">GP27  I2C1 SCL</text>
<text x="190" y="390" font-size="10.5" text-anchor="end" class="mono t">GP28  INT in</text>
<path class="wg" d="M240 108 H 1270"/>
<text x="248" y="102" font-size="11.5" font-weight="700" fill="#047857">3V3 — carrier rail (TLV75733 on VSYS; module 3V3(OUT) feeds nothing here)</text>
<path class="wc" d="M200 200 H 470" marker-end="url(#a)"/>
<path class="wc" d="M200 226 H 470" marker-end="url(#a)"/>
<path class="wc" d="M200 252 H 470" marker-end="url(#a)"/>
<rect x="470" y="164" width="230" height="126" rx="7" fill="#cffafe" stroke="#0891b2" stroke-width="1.8"/>
<text x="585" y="188" font-size="13" font-weight="700" text-anchor="middle" class="t">SSD1306 OLED</text>
<text x="585" y="205" font-size="11" text-anchor="middle" class="mut">128×64 mono, 4-wire SPI</text>
<text x="585" y="228" font-size="10.5" text-anchor="middle" class="mono t">SCK · MOSI · DC</text>
<text x="585" y="246" font-size="10.5" text-anchor="middle" class="t">CS tied LOW — sole SPI1 device</text>
<text x="585" y="264" font-size="10.5" text-anchor="middle" class="t">RES from expander P10</text>
<text x="585" y="282" font-size="10" text-anchor="middle" class="mut">~1 ms full redraw at 8 MHz</text>
<path class="wg" d="M585 108 V 164" marker-end="url(#ag)"/>
<path class="w" d="M200 306 H 1240"/>
<path class="w" d="M200 332 H 1240"/>
<text x="1248" y="310" font-size="10.5" class="mono mut">SDA</text>
<text x="1248" y="336" font-size="10.5" class="mono mut">SCL</text>
<path class="wg" d="M300 108 V 266"/>
<rect x="292" y="266" width="16" height="34" rx="2" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="300" y="287" font-size="8.5" text-anchor="middle" class="mono t">2k2</text>
<path class="w" d="M300 300 V 306"/>
<circle cx="300" cy="306" r="3" fill="#33383f"/>
<path class="wg" d="M340 108 V 292"/>
<rect x="332" y="292" width="16" height="34" rx="2" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="340" y="313" font-size="8.5" text-anchor="middle" class="mono t">2k2</text>
<path class="w" d="M340 326 V 332"/>
<circle cx="340" cy="332" r="3" fill="#33383f"/>
<text x="322" y="150" font-size="10.5" text-anchor="middle" class="mut">one pull-up set</text>
<text x="322" y="163" font-size="10.5" text-anchor="middle" class="mut">for the whole segment</text>
<rect x="430" y="420" width="250" height="150" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
<text x="555" y="444" font-size="13" font-weight="700" text-anchor="middle" class="t">TCA9555PWR</text>
<text x="555" y="462" font-size="11.5" text-anchor="middle" class="mono t">0x20  (A0/A1/A2 → GND)</text>
<text x="555" y="484" font-size="10.5" text-anchor="middle" class="mut">16 I/O · internal pull-ups on inputs</text>
<text x="555" y="500" font-size="10.5" text-anchor="middle" class="mut">so buttons wire straight to GND</text>
<text x="555" y="516" font-size="10.5" text-anchor="middle" class="mut">INT is open-drain → 10 kΩ to 3V3</text>
<text x="555" y="532" font-size="10.5" text-anchor="middle" class="mut">VCC 1.65–5.5 V</text>
<path class="w" d="M539 306 V 420"/>
<circle cx="539" cy="306" r="3" fill="#33383f"/>
<path class="w" d="M571 332 V 420"/>
<circle cx="571" cy="332" r="3" fill="#33383f"/>
<path class="wg" d="M660 108 V 420" marker-end="url(#ag)"/>
<rect x="760" y="420" width="250" height="150" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="885" y="444" font-size="13" font-weight="700" text-anchor="middle" class="t">M24C02 EEPROM</text>
<text x="885" y="462" font-size="11.5" text-anchor="middle" class="mono t">0x56  — now on the carrier</text>
<text x="885" y="484" font-size="10.5" text-anchor="middle" class="mut">settings 0x20–0x9F (128 B)</text>
<text x="885" y="500" font-size="10.5" text-anchor="middle" class="mut">liveness 0x01 · MAC 0x02–07</text>
<text x="885" y="516" font-size="10.5" text-anchor="middle" class="mut">boot flag 0x10 · schema 0x11</text>
<text x="885" y="532" font-size="10.5" text-anchor="middle" class="mut">WC strapped LOW — runtime writes are core;</text>
<text x="885" y="548" font-size="10.5" text-anchor="middle" class="mut">bridge to 3V3 only to write-protect</text>
<path class="w" d="M869 306 V 420"/>
<circle cx="869" cy="306" r="3" fill="#33383f"/>
<path class="w" d="M901 332 V 420"/>
<circle cx="901" cy="332" r="3" fill="#33383f"/>
<path class="wg" d="M990 108 V 420" marker-end="url(#ag)"/>
<path class="w" d="M200 386 H 400 V 470 H 430" marker-end="url(#a)"/>
<rect x="352" y="404" width="16" height="34" rx="2" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="360" y="425" font-size="8.5" text-anchor="middle" class="mono t">10k</text>
<path class="wg" d="M360 108 V 404"/>
<circle cx="360" cy="386" r="3" fill="#33383f"/>
<text x="270" y="378" font-size="10" class="mut">open-drain INT</text>
<rect x="430" y="606" width="250" height="150" rx="7" fill="#ffffff" stroke="#33383f" stroke-width="1.6"/>
<text x="555" y="630" font-size="12.5" font-weight="700" text-anchor="middle" class="t">4 buttons → P00–P03</text>
<text x="452" y="656" font-size="10.5" class="mono t">P00</text>
<path class="w" d="M492 652 H 520"/>
<path class="w" d="M520 652 l 0 -6 M528 652 l 8 -6" stroke-linecap="round"/>
<path class="w" d="M536 652 H 560 V 660" />
<path class="w" d="M552 660 H 568 M556 664 H 564" />
<text x="584" y="656" font-size="10.5" class="t">Up</text>
<text x="452" y="680" font-size="10.5" class="mono t">P01</text>
<path class="w" d="M492 676 H 520"/>
<path class="w" d="M520 676 l 0 -6 M528 676 l 8 -6" stroke-linecap="round"/>
<path class="w" d="M536 676 H 560 V 684" />
<path class="w" d="M552 684 H 568 M556 688 H 564" />
<text x="584" y="680" font-size="10.5" class="t">Down</text>
<text x="452" y="704" font-size="10.5" class="mono t">P02</text>
<path class="w" d="M492 700 H 520"/>
<path class="w" d="M520 700 l 0 -6 M528 700 l 8 -6" stroke-linecap="round"/>
<path class="w" d="M536 700 H 560 V 708" />
<path class="w" d="M552 708 H 568 M556 712 H 564" />
<text x="584" y="704" font-size="10.5" class="t">Select</text>
<text x="452" y="728" font-size="10.5" class="mono t">P03</text>
<path class="w" d="M492 724 H 520"/>
<path class="w" d="M520 724 l 0 -6 M528 724 l 8 -6" stroke-linecap="round"/>
<path class="w" d="M536 724 H 560 V 732" />
<path class="w" d="M552 732 H 568 M556 736 H 564" />
<text x="584" y="728" font-size="10.5" class="t">Esc</text>
<path class="w" d="M555 606 V 570"/>
<rect x="760" y="606" width="250" height="150" rx="7" fill="#f6f7f9" stroke="#33383f" stroke-width="1.4"/>
<text x="885" y="630" font-size="12.5" font-weight="700" text-anchor="middle" class="t">Remaining expander lines</text>
<text x="885" y="654" font-size="11" text-anchor="middle" class="mono t">P10 → OLED RES</text>
<text x="885" y="674" font-size="10.5" text-anchor="middle" class="mut">boot-time only, so I²C latency is fine</text>
<text x="885" y="700" font-size="11" text-anchor="middle" font-weight="600" class="t">11 lines spare → test points</text>
<text x="885" y="716" font-size="10.5" text-anchor="middle" class="mono mut">P04–P07, P11–P17</text>
<text x="885" y="733" font-size="10.5" text-anchor="middle" class="mut">status LEDs · encoder · address DIPs</text>
<path class="w" d="M885 606 V 570"/>
<rect x="1040" y="420" width="244" height="336" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="1162" y="446" font-size="13" font-weight="700" text-anchor="middle" fill="#dc2626">Do not move to the expander</text>
<text x="1058" y="472" font-size="10.5" class="t">DMX DE // RE</text>
<text x="1058" y="489" font-size="10.5" class="t">  switches per frame against PIO</text>
<text x="1058" y="506" font-size="10.5" class="t">  output timing — an I²C round trip</text>
<text x="1058" y="523" font-size="10.5" class="t">  is orders of magnitude too slow.</text>
<text x="1058" y="540" font-size="10.5" class="t"></text>
<text x="1058" y="557" font-size="10.5" class="t">OLED DC</text>
<text x="1058" y="574" font-size="10.5" class="t">  toggles per transaction at SPI</text>
<text x="1058" y="591" font-size="10.5" class="t">  speed, between command and data</text>
<text x="1058" y="608" font-size="10.5" class="t">  bytes of every redraw.</text>
<text x="1058" y="625" font-size="10.5" class="t"></text>
<text x="1058" y="642" font-size="10.5" class="t">WS2812 data</text>
<text x="1058" y="659" font-size="10.5" class="t">  800 kHz one-wire, PIO only.</text>
<text x="1058" y="676" font-size="10.5" class="t"></text>
<text x="1058" y="693" font-size="10.5" class="t">The expander is for things that</text>
<text x="1058" y="710" font-size="10.5" class="t">change at human speed: buttons,</text>
<text x="1058" y="727" font-size="10.5" class="t">resets, mode straps, indicators.</text>
<rect x="36" y="606" width="360" height="150" rx="7" fill="#fbfbfa" stroke="#d4d8dd"/>
<text x="52" y="630" font-size="12.5" font-weight="700" class="t">I²C1 address map</text>
<text x="52" y="654" font-size="11" class="mono t">0x20   TCA9555     A0/A1/A2 = GND</text>
<text x="52" y="674" font-size="11" class="mono t">0x56   M24C02      E1/E2 high, E0 low</text>
<text x="52" y="700" font-size="10.5" class="mut">No collision. TCA9555 can take 0x20–0x27,</text>
<text x="52" y="715" font-size="10.5" class="mut">so up to eight expanders share the bus if</text>
<text x="52" y="730" font-size="10.5" class="mut">the panel ever grows.</text>
<text x="52" y="748" font-size="10.5" class="mut">Run at 400 kHz; the OLED is on SPI, not here.</text>
<text x="1284" y="866" font-size="10.5" text-anchor="end" class="mut">dmx_interface_firmware/docs/rev2-ui-i2c.svg</text>
</svg>