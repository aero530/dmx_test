<text x="36" y="40" font-size="23" font-weight="700" class="t">Rev 2 — WS2812 Output Stage (8 channels)</text>
<text x="36" y="63" font-size="13.5" class="mut">Single-wire WS2812 only. Rev 1's per-channel CLK line is dropped, which is what makes 8 strings fit the pin budget.</text>
