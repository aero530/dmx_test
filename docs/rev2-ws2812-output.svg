<text x="52" y="554" font-size="13" font-weight="700" class="t">Why the level shifter is needed</text>
<text x="52" y="578" font-size="11.5" class="mut">WS2812B needs VIH = 0.7 × VDD, i.e. 3.5 V on a 5 V supply.</text>
<text x="52" y="595" font-size="11.5" class="mut">A 3V3 GPIO does not reliably meet that — it works on the bench and</text>
<text x="52" y="612" font-size="11.5" class="mut">fails on a cold morning at the end of a long cable.</text>
<text x="52" y="629" font-size="11.5" class="mut"></text>
<text x="52" y="646" font-size="11.5" class="mut">The SN74ACT245 is a single-supply part on 5 V, not a dual-rail</text>
<text x="52" y="663" font-size="11.5" class="mut">translator. It works here because ACT has TTL input thresholds</text>
<text x="52" y="680" font-size="11.5" class="mut">(VIH = 2.0 V), so 3V3 CMOS drive is comfortably a valid logic 1.</text>
<text x="52" y="697" font-size="11.5" class="mut">Do not substitute an AC/HC part — those have CMOS thresholds</text>
<text x="52" y="714" font-size="11.5" class="mut">at 0.7 × VCC = 3.5 V and would not accept 3V3 in.</text>
<rect x="680" y="530" width="604" height="196" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="696" y="554" font-size="13" font-weight="700" fill="#dc2626">Rev 1 issues fixed here</text>
<text x="696" y="578" font-size="11.5" class="t">Channel numbering was reversed — U10 A1/A2 carried LED4 data, so</text>
<text x="696" y="595" font-size="11.5" class="t">connector "LEDn" actually drove channel (5 − n). Fix the A-side order</text>
<text x="696" y="612" font-size="11.5" class="t">in Rev 2 rather than patching the silkscreen.</text>
<text x="696" y="629" font-size="11.5" class="t"></text>
<text x="696" y="646" font-size="11.5" class="t">JP21 let DIR be pulled low, turning the A side into 5 V outputs driving</text>
<text x="696" y="663" font-size="11.5" class="t">straight into the MCU (review §2.2). DIR is now strapped; JP21 is gone.</text>
<text x="696" y="680" font-size="11.5" class="t"></text>
<text x="696" y="697" font-size="11.5" class="t">No per-output fusing (§3.7) — a shorted strip cable made the wiring the</text>
<text x="696" y="714" font-size="11.5" class="t">fuse. PF1–PF8 now sit in each output's 5 V leg.</text>
<rect x="36" y="736" width="1248" height="52" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="52" y="756" font-size="12" font-weight="700" fill="#dc2626">Do NOT use an auto-direction translator here</text>
<text x="52" y="774" font-size="11" class="t">TXS0108E and friends sense direction with one-shot edge accelerators and internal 10 kΩ pull-ups. They are built for bidirectional open-drain buses (I²C), drive weakly, and</text>
<text x="52" y="788" font-size="11" class="t">false-trigger on the reflections a strip cable produces — a documented failure mode with WS2812. This path is unidirectional and needs a real push-pull driver.</text>
<text x="36" y="812" font-size="11.5" class="mut">Long runs: inject 5 V at the far end of each string and tie grounds back — the 330 Ω series R damps edges at the source but does nothing for volt-drop along the strip.</text>
<text x="36" y="834" font-size="11.5" class="mut">Refresh: 600 LEDs × 24 bits × 1.25 µs = 18.0 ms per frame. All eight strings clock out in parallel on separate PIO state machines, so the frame time is set by the longest string, not the total.</text>
<text x="1284" y="880" font-size="10.5" text-anchor="end" class="mut">dmx_interface_firmware/docs/rev2-ws2812-output.svg</text>
</svg>