[package]
name = "host_tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-runnable unit tests for the pure-logic parts of the nucleo firmware"

[features]
# The firmware sources use cfg_if to select `log` macros (host-friendly)
# instead of `defmt` macros when the `usb` feature is enabled. Keep it always
# on here so the included sources never invoke defmt logging on the host.
default = ["usb"]
usb = []

[dependencies]
# The crate under test. `usb` selects the `log` macros over defmt's, so the
# sources never invoke defmt logging on the host.
common = { path = "../common", features = ["usb"] }

# `common`'s shared buffers use CriticalSectionRawMutex, which needs an
# implementation linked. The firmware gets one from cortex-m; the host gets it
# from here. See the module docs in common/src/buffers.rs.
critical-section = { version = "1", features = ["std"] }

bincode = { version = "2.0.1", default-features = false, features = ["derive"] }
cfg-if = "1"
# unstable-test mocks the logger symbols so `derive(Format)` links on the host
defmt = { version = "1", features = ["unstable-test"] }
enum-ordinalize = "4.3.0"
heapless = { version = "0.9", default-features = false }
log = "0.4"
micromath = "2"
smart-leds = "0.4"
