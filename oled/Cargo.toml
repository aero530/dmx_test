[package]
name = "oled_async"
version = "0.1.0"
edition = "2021"

[package.metadata.docs.rs]
targets = [ "thumbv8m.main-none-eabihf" ]

[dependencies]
defmt = "1.0.1"
embedded-hal = "1.0.0"
embedded-graphics-core = { version = "0.4", optional = true }
display-interface = "^ 0.5"

[dev-dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embedded-graphics = "0.8"
heapless = "0.9.1"
panic-semihosting = "0.6.0"
cortex-m-rtic = "1.1.4"
display-interface-i2c = "^ 0.5"
display-interface-spi = "^ 0.5"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embassy-executor = { version = "0.9.1", features = ["defmt", "arch-cortex-m", "executor-thread"] }
embedded-hal-async = { version = "1.0" }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# [patch.crates-io]
# embedded-graphics = {path="/home/cschuhen/rust/embedded-graphics"}
# embedded-graphics-core = {path="/home/cschuhen/rust/embedded-graphics/core"}

# [dependencies.stm32h5xx-hal]
# version = "0.11.0"
# optional = true
# features = [ "stm32h563" ]


[dependencies.embassy-stm32]
optional = true
version = "0.4.0"
features = ["defmt", "time-driver-any", "stm32h563zi", "memory-x", "unstable-pac", "exti"]

[dependencies.embassy-time]
optional = true
version = "0.5.0"
features = ["defmt", "tick-hz-32_768"]


[features]
default = ["graphics"]
graphics = ["embedded-graphics-core"]
#graphics = ["embedded-graphics"]

# These features are for development/testing
# stm32f1 = ["stm32f1xx-hal"]
# stm32f4 = ["stm32f4xx-hal"]
# stm32g4 = ["stm32g4xx-hal"]
embassy-stm32 = ["dep:embassy-time", "dep:embassy-stm32"]
spi = []
i2c = []

[profile.dev]
codegen-units = 1
incremental = false

[profile.release]
codegen-units = 1
debug = true
lto = true
