[package]
edition = "2024"
name = "rp2040_dmx"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]

embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0",  features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1",  features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0",  features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }

embassy-futures = { version = "0.1.2"}
embassy-usb-logger = { version = "0.6.0" }
# cyw43 = { version = "0.5.0", features = ["defmt", "firmware-logs"] }
# cyw43-pio = { version = "0.8.0",  features = ["defmt"] }

defmt = "1.1.1"
defmt-rtt = "1.3.0"
fixed = "1.29.0"
fixed-macro = "1.2"


cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
critical-section = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# byte-slice-cast = { version = "1.2.0", default-features = false }
# smart-leds = "0.4.0"
# heapless = "0.9.1"
# usbd-hid = "0.8.1"

# embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
# embedded-hal-async = "1.0"
# embedded-hal-bus = { version = "0.3.0", features = ["async"] }
# embedded-io-async = { version = "0.6.1", features = ["defmt-03"] }
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }
log = "0.4"

smart-leds = "0.4.0"


# # cargo build/run
# [profile.dev]
# codegen-units = 1
# debug = 2
# debug-assertions = true
# incremental = false
# opt-level = 3
# overflow-checks = true

# # cargo build/run --release
# [profile.release]
# codegen-units = 1
# debug = 2
# debug-assertions = false
# incremental = false
# lto = 'fat'
# opt-level = 3
# overflow-checks = false

# # do not optimize proc-macro crates = faster builds from scratch
# [profile.dev.build-override]
# codegen-units = 8
# debug = false
# debug-assertions = false
# opt-level = 0
# overflow-checks = false

# [profile.release.build-override]
# codegen-units = 8
# debug = false
# debug-assertions = false
# opt-level = 0
# overflow-checks = false

# # cargo test
# [profile.test]
# codegen-units = 1
# debug = 2
# debug-assertions = true
# incremental = false
# opt-level = 3
# overflow-checks = true

